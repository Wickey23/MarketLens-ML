name: daily-market-research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements-ml.txt"
      - ".github/workflows/daily-research.yml"
  schedule:
    - cron: "0 15 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "15 20 * * 1-5"
    - cron: "30 22 * * 1-5"
permissions:
  contents: write
concurrency:
  group: marketlens-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ml.txt
      - run: python -m src.export_dashboard
      - name: Commit refreshed research data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add -f data/dashboard.json
          git diff --cached --quiet || git commit -m "Update MarketLens research data"
          git push
