name: autonomous-paper-trader

on:
  workflow_dispatch:
  schedule:
    - cron: "2-57/5 13-21 * * 1-5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/autonomous-paper-trader.yml"

permissions:
  contents: write

concurrency:
  group: marketlens-data-writer
  cancel-in-progress: false

jobs:
  autonomous-paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      ALPACA_OPTIONS_FEED: ${{ secrets.ALPACA_OPTIONS_FEED }}
      ALPACA_STOCK_FEED: ${{ secrets.ALPACA_STOCK_FEED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Load persistent market and AI state
        run: |
          git fetch origin market-data
          git show origin/market-data:data/dashboard.json > data/dashboard.json || true
          git show origin/market-data:data/ai_paper_portfolio.json > data/ai_paper_portfolio.json || true
      - run: pip install -r requirements-ml.txt
      - name: Tradier market-data entitlement preflight
        env:
          TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import os, urllib.request, urllib.error, urllib.parse, json
          token=os.getenv("TRADIER_ACCESS_TOKEN")
          if not token:
              print("::warning::TRADIER_ACCESS_TOKEN is not configured; autonomous entries will remain blocked")
              raise SystemExit(0)
          headers={"Authorization":f"Bearer {token}","Accept":"application/json","User-Agent":"MarketLens-ML/1.0"}
          checks=[
              ("clock","https://api.tradier.com/v1/markets/clock"),
              ("stock quote","https://api.tradier.com/v1/markets/quotes?"+urllib.parse.urlencode({"symbols":"SPY","greeks":"false"})),
              ("option expirations","https://api.tradier.com/v1/markets/options/expirations?"+urllib.parse.urlencode({"symbol":"SPY","includeAllRoots":"false"})),
          ]
          results={}
          for label,url in checks:
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=8) as r:
                      results[label]=r.status
                      print(f"Tradier {label} preflight HTTP {r.status}")
              except urllib.error.HTTPError as e:
                  results[label]=e.code
                  print(f"::warning::Tradier {label} preflight HTTP {e.code}")

          live_ok = results.get("stock quote") == 200 and results.get("option expirations") == 200
          sandbox_results={}
          if not live_ok:
              sandbox_checks=[
                  ("stock quote","https://sandbox.tradier.com/v1/markets/quotes?"+urllib.parse.urlencode({"symbols":"SPY","greeks":"false"})),
                  ("option expirations","https://sandbox.tradier.com/v1/markets/options/expirations?"+urllib.parse.urlencode({"symbol":"SPY","includeAllRoots":"false"})),
              ]
              for label,url in sandbox_checks:
                  req=urllib.request.Request(url,headers=headers)
                  try:
                      with urllib.request.urlopen(req,timeout=8) as r:
                          sandbox_results[label]=r.status
                          print(f"Tradier sandbox {label} preflight HTTP {r.status}")
                  except urllib.error.HTTPError as e:
                      sandbox_results[label]=e.code
                      print(f"Tradier sandbox {label} preflight HTTP {e.code}")

              sandbox_ok = sandbox_results.get("stock quote") == 200 and sandbox_results.get("option expirations") == 200
              if sandbox_ok:
                  print("::error::TRADIER_ACCESS_TOKEN is valid for sandbox/delayed market data but not the production real-time market-data endpoints. Replace the GitHub Actions secret with the Production Token from Tradier API Settings.")
              else:
                  print("::error::Tradier production quotes/options are unauthorized and the same token is not usable on sandbox quotes/options. The token is invalid, expired, or the brokerage account lacks market-data entitlement.")

          with open("/tmp/tradier_preflight.json","w") as fp:
              json.dump({"live_ok": live_ok, "production": results, "sandbox": sandbox_results}, fp)
          PY
      - name: Run market-wide autonomous paper cycle
        run: python -m src.fast_refresh
      - name: Persist market research and AI portfolio
        run: |
          cp data/dashboard.json /tmp/dashboard.json
          cp data/ai_paper_portfolio.json /tmp/ai_paper_portfolio.json
          git reset --hard
          git fetch origin market-data
          git checkout -B market-data origin/market-data
          cp /tmp/dashboard.json data/dashboard.json
          cp /tmp/ai_paper_portfolio.json data/ai_paper_portfolio.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/dashboard.json data/ai_paper_portfolio.json
          git diff --cached --quiet || git commit -m "Run autonomous MarketLens paper-trading cycle"
          git push origin HEAD:market-data

      - name: Verify execution-grade market-data readiness
        run: |
          python - <<'PY'
          import json, os
          path="/tmp/tradier_preflight.json"
          if not os.path.exists(path):
              raise SystemExit("Tradier preflight did not produce a readiness result")
          with open(path) as fp:
              result=json.load(fp)
          if not result.get("live_ok"):
              raise SystemExit("Execution-grade Tradier stock/options data is not authorized; autonomous paper entries remain blocked")
          print("Execution-grade Tradier market data is authorized")
          PY
