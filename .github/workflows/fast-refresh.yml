name: fast-market-refresh
on:
  push:
    branches: [main]
    paths:
      - "src/fast_refresh.py"
      - "src/ai_paper_trader.py"
      - "src/opportunity_radar.py"
      - ".github/workflows/fast-refresh.yml"
  workflow_dispatch:
    inputs:
      ticker:
        description: "Optional ticker to refresh"
        required: false
        type: string
  schedule:
    - cron: "*/30 13-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: marketlens-data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MARKETLENS_TICKER: ${{ github.event.inputs.ticker }}
      TRADIER_ACCESS_TOKEN: ${{ secrets.TRADIER_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Load persistent market state
        run: |
          git fetch origin market-data
          git show origin/market-data:data/dashboard.json > data/dashboard.json || true
          git show origin/market-data:data/ai_paper_portfolio.json > data/ai_paper_portfolio.json || true
      - run: pip install -r requirements-ml.txt
      - run: python -m src.fast_refresh
      - name: Commit fast market data to market-data branch
        run: |
          cp data/dashboard.json /tmp/dashboard.json
          cp data/ai_paper_portfolio.json /tmp/ai_paper_portfolio.json
          git reset --hard
          git fetch origin market-data
          git checkout -B market-data origin/market-data
          cp /tmp/dashboard.json data/dashboard.json
          cp /tmp/ai_paper_portfolio.json data/ai_paper_portfolio.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/dashboard.json data/ai_paper_portfolio.json
          git diff --cached --quiet || git commit -m "Refresh MarketLens market and options data"
          git push origin HEAD:market-data
