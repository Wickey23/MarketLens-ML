name: fast-market-refresh
on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "Optional ticker to refresh"
        required: false
        type: string
  schedule:
    - cron: "0 * * * 1-5"

permissions:
  contents: write

concurrency:
  group: fast-market-refresh-${{ github.event.inputs.ticker || 'core' }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      MARKETLENS_TICKER: ${{ github.event.inputs.ticker }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ml.txt
      - run: python -m src.fast_refresh
      - name: Commit fast market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/dashboard.json
          git stash push --keep-index --include-untracked -m marketlens-generated || true
          git pull --rebase
          git stash pop || true
          git add -f data/dashboard.json
          git diff --cached --quiet || git commit -m "Refresh MarketLens market and options data"
          git push
